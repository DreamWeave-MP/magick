# Magick as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `magick-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "4aefcc8f-913f-48f5-8980-2326173a7288"
slug = "magick"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.magick"

[[releases]]
version = "0.1.2"
date = 2026-10-19
summary = "First release published as a DreamWeave project."

[[releases]]
version = "0.1.3"
date = 2026-10-21
summary = "Anti-aliased paths through @magick/path, Image.screen and Image.scale."
