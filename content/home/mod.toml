# Magick as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `magick-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "4aefcc8f-913f-48f5-8980-2326173a7288"
slug = "magick"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.magick"

[[releases]]
version = "0.1.2"
date = 2026-10-19
summary = "First release published as a DreamWeave project."

[[releases]]
version = "0.1.3"
date = 2026-10-21
summary = "Anti-aliased paths through @magick/path, Image.screen and Image.scale."

[[releases]]
version = "0.2.0"
date = 2026-11-27
summary = "Vector and paint foundation: retained paths and affine transforms, exact nonzero and evenodd coverage over tiles, strokes with joins, caps and dashes, premultiplied working tiles, gradients, patterns, the sixteen W3C blend modes and isolated groups."

[[releases]]
version = "0.3.0"
date = 2026-11-27
summary = "Retained canvas: typed scenes compiled to immutable plans, tiled rendering with the same bytes at every tile size and on Jess workers, group clips, masks, blur and shadow filters, and saved scenes."

[[releases]]
version = "0.5.0"
date = 2026-11-27
summary = "Atelier and Masterpiece: seeded noise and fields, procedural paints, a stamped brush engine with five media presets, material recipes and monoline text; reference-guided painting against real renders, with the Mona Lisa from a pinned public-domain photograph; an SVG subset in and out, held to librsvg; and adversarial, 8K and 100,000-node hardening. 0.4.0 was planned but never tagged: its changes ship here."
