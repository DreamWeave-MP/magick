manifest_version = 1

[package]
id = "org.dreamweave.magick"
version = "0.1.2"
jess_api = "1"
include = ["src", "LICENSES", "README.md", "tests"]
tests = ["tests/basic.jsl", "tests/png.jsl", "tests/style.jsl"]

[modules]
"@magick" = "src/init.jsl"

[[layer]]
id = "org.dreamweave.magick"
requires = []
exports = ["@magick"]

# The Mod Template builds this repository's site and releases; `jess workspace run --trusted
# dreamweave-build` runs it over this folder from the lock, as a site built from the template does.
[dev-dependencies]
"org.dreamweave.mod-template" = "0.3"
