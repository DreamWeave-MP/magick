manifest_version = 1

[package]
id = "org.dreamweave.magick"
version = "0.3.0"
jess_api = "1"
include = ["src", "LICENSES", "README.md", "COMPATIBILITY.md", "tests", "demos"]
tests = ["tests/basic.jsl", "tests/compat.jsl", "tests/gate.jsl", "tests/property.jsl", "tests/png.jsl", "tests/path.jsl", "tests/resample.jsl", "tests/rfc.jsl", "tests/rfc_contracts.jsl", "tests/transform.jsl", "tests/coverage.jsl", "tests/stroke.jsl", "tests/color.jsl", "tests/paint.jsl", "tests/pattern.jsl", "tests/blend.jsl", "tests/scene.jsl", "tests/serialize.jsl", "tests/noise.jsl", "tests/brush.jsl", "tests/material.jsl", "tests/text.jsl", "tests/art.jsl", "tests/painter.jsl", "tests/svg.jsl", "tests/fuzz.jsl", "tests/style.jsl"]

[modules]
"@magick" = "src/init.jsl"
"@magick/path" = "src/path.jsl"
"@magick/transform" = "src/transform.jsl"
"@magick/color" = "src/color.jsl"
"@magick/paint" = "src/paint.jsl"
"@magick/scene" = "src/scene.jsl"
"@magick/render" = "src/render.jsl"
"@magick/noise" = "src/noise.jsl"
"@magick/brush" = "src/brush.jsl"
"@magick/material" = "src/material.jsl"
"@magick/text" = "src/text.jsl"
"@magick/art" = "src/art.jsl"
"@magick/painter" = "src/painter.jsl"
"@magick/svg" = "src/svg.jsl"

[[layer]]
id = "org.dreamweave.magick"
requires = []
exports = ["@magick", "@magick/path", "@magick/transform", "@magick/color", "@magick/paint", "@magick/scene", "@magick/render", "@magick/noise", "@magick/brush", "@magick/material", "@magick/text", "@magick/art", "@magick/painter", "@magick/svg"]

[targets.workers-check]
kind = "application"
entry = "tests/workers.jsl"
capabilities = ["worker.spawn"]

[targets.showcase]
kind = "application"
entry = "tests/showcase.jsl"
capabilities = ["worker.spawn"]

[targets.stress]
kind = "application"
entry = "tests/stress.jsl"
capabilities = ["worker.spawn"]
